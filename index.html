<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点名系统 · 历史记录</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #333; -webkit-font-smoothing: antialiased; }
.nav { position: sticky; top: 0; z-index: 100; display: flex; gap: 4px; padding: 10px 16px; background: #2c3e50; overflow-x: auto; white-space: nowrap; }
.nav a { color: #cfd8dc; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; flex-shrink: 0; transition: all .2s; }
.nav a:hover { background: #34495e; color: #fff; }
.nav a.active { background: #3498db; color: #fff; font-weight: 600; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px 16px 40px; }
.page-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { padding: 8px 18px; background: #fff; border-radius: 20px; text-decoration: none; color: #555; border: 1px solid #e0e0e0; font-size: 14px; cursor: pointer; transition: all .2s; }
.tab:hover { border-color: #3498db; color: #3498db; }
.tab.active { background: #2c3e50; color: #fff; border-color: #2c3e50; }
.table-card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 10px; text-align: left; font-size: 14px; }
th { background: #fafbfc; color: #666; font-weight: 600; border-bottom: 1px solid #eee; white-space: nowrap; }
td { border-bottom: 1px solid #f2f2f2; }
tr:last-child td { border-bottom: none; }
tr.clickable { cursor: pointer; transition: background .15s; }
tr.clickable:hover { background: #f0f7ff; }
td.num, th.num { text-align: center; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 500; }
.badge.present { background: #e8f8ef; color: #27ae60; }
.badge.leave   { background: #fef5e7; color: #f39c12; }
.badge.absent  { background: #fdecea; color: #e74c3c; }
.summary { display: flex; gap: 12px; flex-wrap: wrap; background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.summary .item { flex: 1; min-width: 80px; text-align: center; }
.summary .num { font-size: 22px; font-weight: 700; }
.summary .label { font-size: 12px; color: #888; margin-top: 2px; }
.num-present { color: #27ae60; } .num-leave { color: #f39c12; } .num-absent { color: #e74c3c; }
.modal-mask { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.45); align-items: center; justify-content: center; padding: 16px; }
.modal-mask.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #eee; }
.modal-head h3 { font-size: 16px; }
.modal-head .close { background: none; border: none; font-size: 22px; cursor: pointer; color: #999; line-height: 1; }
.modal-body { padding: 16px 18px; }
#login-page { position: fixed; inset: 0; background: #2c3e50; display: flex; align-items: center; justify-content: center; z-index: 999; }
.login-box { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
.login-box h2 { margin-bottom: 20px; font-size: 18px; color: #333; }
.login-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 16px; font-size: 16px; outline: none; }
.login-box input:focus { border-color: #3498db; }
.login-box button { width: 100%; padding: 12px; background: #3498db; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
.login-box button:hover { background: #2980b9; }
.error-msg { color: #e74c3c; font-size: 13px; margin-bottom: 10px; display: none; }
@media (max-width: 600px) { .container { padding: 12px 8px 30px; } th, td { padding: 9px 6px; font-size: 12px; } .page-title { font-size: 17px; } }
</style>
</head>
<body>

<div id="login-page">
  <div class="login-box">
    <h2>请输入访问密码</h2>
    <p class="error-msg" id="error-msg">密码错误，请重试</p>
    <input type="password" id="pwd" placeholder="请输入密码">
    <button onclick="checkPwd()">进入系统</button>
  </div>
</div>

<div id="main-page" style="display: none;">
  <nav class="nav">
    <a href="index.html" class="active">历史记录</a>
    <a href="students.html">学生名单</a>
  </nav>
  
  <main class="container">
    <h1 class="page-title">历史记录</h1>

    <!-- 组别 Tab -->
    <div class="tabs" id="group-tabs">

    </div>

    <div class="table-card">

        <thead>

            <th class="num">到场</th><th class="num">请假</th><th class="num">缺勤</th>
          </tr>
        </thead>
        <tbody id="student-list">
          <!-- JS 动态渲染 -->
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- 明细模态窗 -->
<div class="modal-mask" id="modal" onclick="if(event.target===this)closeModal()">

      </div>
      <table>
        <thead><tr><th style="width: 40%;">日期</th><th>状态</th></tr></thead>
        <tbody id="modal-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

// 渲染逻辑
function renderTable() {
  const tbody = document.getElementById('student-list');
  tbody.innerHTML = '';
  
  let data = [];
  if (currentGroup === '街舞组') {
    data = currentMonth === '10月' ? hiphopOct : hiphopNov;
  } else {
    data = skillData;
  }

  // 如果没有数据
  if (data.length === 0 || data[0].records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:30px;">该组别暂无数据记录</td></tr>';
    return;
  }

  data.forEach((stu) => {
    let p = 0, l = 0, a = 0;
    
    stu.records.forEach(r => {
      if (r.s === '') return;
      if (r.s.includes('缺勤') || r.s.includes('没来') || r.s.includes('退')) a++;
      else if (r.s !== '到场' && !r.s.includes('✓')) l++;
      else p++;
    });

    const tr = document.createElement('tr');
    tr.className = 'clickable';
    tr.onclick = () => showDetail(stu.name, stu.college + ' / ' + stu.cls, p, l, a, stu.records);
    tr.innerHTML = `
      <td>${stu.college}</td><td>${stu.cls}</td><td>${stu.name}</td><td>${stu.id}</td>
      <td class="num"><span class="badge ${p>0?'present':'leave'}" style="${p===0?'background:#f0f0f0;color:#999':''}">${p}</span></td>
      <td class="num"><span class="badge ${l>0?'leave':'leave'}" style="${l===0?'background:#f0f0f0;color:#999':''}">${l}</span></td>
      <td class="num"><span class="badge ${a>0?'absent':'absent'}" style="${a===0?'background:#f0f0f0;color:#999':''}">${a}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function switchGroup(group) {
  currentGroup = group;
  document.querySelectorAll('#group-tabs .tab').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

function switchMonth(month) {
  currentMonth = month;
  document.querySelectorAll('#month-tabs .tab').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

window.onload = function() {
  if (sessionStorage.getItem('logged_in') === 'true') {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
  }
  renderTable();
}

function checkPwd() {
  const input = document.getElementById('pwd').value;
  if (input === CORRECT_PWD) {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    sessionStorage.setItem('logged_in', 'true');
  } else {
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('pwd').value = '';
  }
}

function showDetail(name, meta, p, l, a, records) {
  document.getElementById('modal-title').textContent = name + ' 的考勤记录';
  document.getElementById('modal-meta').textContent = meta;
  document.getElementById('m-present').textContent = p;
  document.getElementById('m-leave').textContent = l;
  document.getElementById('m-absent').textContent = a;

  const tbody = document.getElementById('modal-tbody');
  tbody.innerHTML = '';
  
  if (!records || records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;color:#999;padding:20px;">暂无记录</td></tr>';
  } else {
    records.forEach(r => {
      if (r.s === '') return;
      let badgeClass = 'present';
      if (r.s.includes('缺勤') || r.s.includes('没来') || r.s.includes('退')) badgeClass = 'absent';
      else if (r.s !== '到场' && !r.s.includes('✓')) badgeClass = 'leave';
      
      tbody.innerHTML += `<tr>
        <td>${r.d}</td>
        <td><span class="badge ${badgeClass}">${r.s}</span></td>
      </tr>`;
    });
  }
  
  document.getElementById('modal').classList.add('show');
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
