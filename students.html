th, td { padding: 12px 10px; text-align: left; font-size: 14px; }

@media (max-width: 600px) { .container { padding: 12px 8px 30px; } th, td { padding: 9px 6px; font-size: 12px; } .page-title { font-size: 17px; } }

    document.getElementById('tab-skill').classList.add('active');

}
